<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japanese Kana Master Pro v2</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6}header{background:#2563eb;color:#fff;padding:12px;text-align:center}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.nav button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff}.panel{background:#fff;border-radius:12px;padding:16px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}.card{border:1px solid #ddd;border-radius:10px;padding:8px;text-align:center}.kana{font-size:2rem;font-weight:bold}.big{font-size:5rem;text-align:center}.progress{height:18px;background:#ddd;border-radius:20px}.bar{height:18px;background:#22c55e;width:0%;border-radius:20px}@media(max-width:600px){.big{font-size:3.5rem}}</style></head><body><header><h1>Japanese Kana Master Pro v2</h1></header><div class="wrap"><div class="nav"><button onclick="tab('dashboard')">Dashboard</button><button onclick="tab('learn')">Learn</button><button onclick="tab('flash')">Flashcards</button><button onclick="tab('quiz')">Quiz</button><button onclick="tab('review')">Weak Review</button><button onclick="tab('chart')">Kana Chart</button></div><div id="dashboard" class="panel"><h2>Progress</h2><p>Score: <span id="score">0</span></p><p>Mastery: <span id="mastery">0%</span></p><div class="progress"><div id="bar" class="bar"></div></div></div><div id="learn" class="panel hidden"><div id="learnKana" class="big"></div><h2 id="learnRomaji" style="text-align:center"></h2><div style="text-align:center"><button onclick="speakCurrent()">🔊 Audio</button><button onclick="prevLearn()">◀</button><button onclick="nextLearn()">▶</button></div></div><div id="flash" class="panel hidden"><div id="flashKana" class="big"></div><div id="flashAns" style="display:none;text-align:center;font-size:2rem"></div><div style="text-align:center"><button onclick="reveal()">Reveal</button><button onclick="nextFlash()">Next</button></div></div><div id="quiz" class="panel hidden"><div id="quizKana" class="big"></div><div style="text-align:center"><button onclick="speakQuiz()">🔊</button></div><div id="feedback"></div><div id="choices" class="grid"></div></div><div id="review" class="panel hidden"><h2>Weak Characters</h2><div id="weak"></div></div><div id="chart" class="panel hidden"><input id="search" placeholder="Search kana or romaji" onkeyup="filterCards()" style="width:100%;padding:10px"><h2>Hiragana</h2><div id="hgrid" class="grid"></div><h2>Katakana</h2><div id="kgrid" class="grid"></div></div></div><script>const kana=[["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],["さ","sa"],["し","shi"],["す","su"],["せ","se"],["そ","so"],["た","ta"],["ち","chi"],["つ","tsu"],["て","te"],["と","to"],["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"],["は","ha"],["ひ","hi"],["ふ","fu"],["へ","he"],["ほ","ho"],["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"],["や","ya"],["ゆ","yu"],["よ","yo"],["ら","ra"],["り","ri"],["る","ru"],["れ","re"],["ろ","ro"],["わ","wa"],["を","wo"],["ん","n"],["ア","a"],["イ","i"],["ウ","u"],["エ","e"],["オ","o"],["カ","ka"],["キ","ki"],["ク","ku"],["ケ","ke"],["コ","ko"],["サ","sa"],["シ","shi"],["ス","su"],["セ","se"],["ソ","so"],["タ","ta"],["チ","chi"],["ツ","tsu"],["テ","te"],["ト","to"],["ナ","na"],["ニ","ni"],["ヌ","nu"],["ネ","ne"],["ノ","no"],["ハ","ha"],["ヒ","hi"],["フ","fu"],["ヘ","he"],["ホ","ho"],["マ","ma"],["ミ","mi"],["ム","mu"],["メ","me"],["モ","mo"],["ヤ","ya"],["ユ","yu"],["ヨ","yo"],["ラ","ra"],["リ","ri"],["ル","ru"],["レ","re"],["ロ","ro"],["ワ","wa"],["ヲ","wo"],["ン","n"]];let s=+localStorage.score||0,c=+localStorage.correct||0,seen=+localStorage.seen||0,li=0,fi=0,qi=0;const weak=JSON.parse(localStorage.weak||'{}');function save(){localStorage.score=s;localStorage.correct=c;localStorage.seen=seen;localStorage.weak=JSON.stringify(weak)}function tab(id){['dashboard','learn','flash','quiz','review','chart'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';speechSynthesis.speak(u)}function speakCurrent(){speak(kana[li][0])}function speakQuiz(){speak(kana[qi%kana.length][0])}function upd(){learnKana.textContent=kana[li][0];learnRomaji.textContent=kana[li][1]}function nextLearn(){li=(li+1)%kana.length;upd()}function prevLearn(){li=(li-1+kana.length)%kana.length;upd()}function reveal(){flashAns.style.display='block'}function nextFlash(){fi=(fi+1)%kana.length;flashKana.textContent=kana[fi][0];flashAns.textContent=kana[fi][1];flashAns.style.display='none'}function sh(a){return [...a].sort(()=>Math.random()-.5)}function rq(){const q=kana[qi%kana.length];quizKana.textContent=q[0];const opts=sh([q[1],...sh(kana.filter(x=>x[1]!=q[1])).slice(0,3).map(x=>x[1])]);choices.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>ans(o,q);choices.appendChild(b)})}function ans(sel,q){seen++;if(sel===q[1]){s++;c++}else weak[q[0]]=(weak[q[0]]||0)+1;save();dash();qi++;setTimeout(rq,400)}function dash(){score.textContent=s;let m=seen?Math.round(c/seen*100):0;mastery.textContent=m+'%';bar.style.width=m+'%';weak.innerHTML=Object.entries(weak).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]+' ('+x[1]+')').join('<br>')}function renderChart(){hgrid.innerHTML=kana.slice(0,46).map(k=>`<div class=card><div class=kana>${k[0]}</div><div>${k[1]}</div><button onclick="speak('${k[0]}')">🔊</button></div>`).join('');kgrid.innerHTML=kana.slice(46).map(k=>`<div class=card><div class=kana>${k[0]}</div><div>${k[1]}</div><button onclick="speak('${k[0]}')">🔊</button></div>`).join('')}function filterCards(){let v=search.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>{if(c.parentElement.id==='hgrid'||c.parentElement.id==='kgrid')c.style.display=c.textContent.toLowerCase().includes(v)?'block':'none'})}upd();flashKana.textContent=kana[0][0];flashAns.textContent=kana[0][1];dash();rq();renderChart();</script></body></html>
